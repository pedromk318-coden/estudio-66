name: Render film in the cloud

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Project 1 (example: films/my-video)"
        required: true
        type: string
      project_path_2:
        description: "Project 2 (optional)"
        required: false
        type: string
      project_path_3:
        description: "Project 3 (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build render matrix
        id: set-matrix
        env:
          PROJECT_1: ${{ inputs.project_path }}
          PROJECT_2: ${{ inputs.project_path_2 }}
          PROJECT_3: ${{ inputs.project_path_3 }}
        run: |
          python - <<'PY'
          import json, os
          paths = [os.environ.get(f"PROJECT_{i}", "").strip() for i in range(1, 4)]
          paths = [p for p in paths if p]
          if len(paths) != len(set(paths)):
              raise SystemExit("The same project folder cannot be submitted more than once.")
          if not paths:
              raise SystemExit("Provide at least one project folder.")
          matrix = {"include": [{"project_path": p, "index": i} for i, p in enumerate(paths, 1)]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(matrix) + "\n")
          print(f"Preparing {len(paths)} render job(s), maximum 3 in parallel.")
          PY

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Validate project folder
        env:
          PROJECT_PATH: ${{ matrix.project_path }}
        shell: bash
        run: |
          case "$PROJECT_PATH" in
            films/*) ;;
            *) echo "::error::Project must be inside films/"; exit 1 ;;
          esac
          test -f "$PROJECT_PATH/build.sh" || {
            echo "::error::Missing $PROJECT_PATH/build.sh"; exit 1;
          }

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: biblioteca/package-lock.json

      - name: Install Node packages and headless Chromium
        working-directory: biblioteca
        run: |
          npm ci
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: biblioteca/requirements.txt

      - name: Install Python packages and FFmpeg 7 binary
        run: |
          python -m venv biblioteca/.venv
          biblioteca/.venv/bin/python -m pip install --upgrade pip
          biblioteca/.venv/bin/python -m pip install -r biblioteca/requirements.txt
          python -m pip install imageio-ffmpeg==0.6.0
          sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -n 1

      - name: Render MP4
        env:
          LIB: ${{ github.workspace }}/biblioteca
          PROJECT_PATH: ${{ matrix.project_path }}
          RENDER_SLOTS: "1"
        shell: bash
        run: |
          chmod +x "$PROJECT_PATH/build.sh"
          "$PROJECT_PATH/build.sh"
          find "$PROJECT_PATH" -type f -name '*.mp4' -size +0c -print -quit | grep -q . || {
            echo "::error::No non-empty MP4 was produced"; exit 1;
          }

      - name: Upload rendered video and supporting files
        uses: actions/upload-artifact@v4
        with:
          name: estudio-66-${{ github.run_number }}-${{ matrix.index }}
          path: |
            ${{ matrix.project_path }}/*.mp4
            ${{ matrix.project_path }}/**/*.mp4
            ${{ matrix.project_path }}/**/*.jpg
            ${{ matrix.project_path }}/**/*.srt
            ${{ matrix.project_path }}/TREATMENT.md
            ${{ matrix.project_path }}/CREDITS
            ${{ matrix.project_path }}/legenda.txt
          if-no-files-found: error
          retention-days: 7
