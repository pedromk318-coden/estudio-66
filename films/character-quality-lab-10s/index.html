   </g>

   <g id="rightArm" transform="rotate(0 720 1080)">
    <path d="M720 1080Q795 1110 830 1230L810 1380Q790 1440 735 1420Q695 1400 710 1340L690 1210Q675 1130 720 1080Z" fill="url(#jacket)" stroke="#1b2e4e" stroke-width="15"/>
    <path d="M760 1370Q790 1390 825 1350L860 1295Q890 1265 915 1295Q935 1325 900 1365L845 1430Q790 1480 740 1435Z" fill="url(#skin)" stroke="#914b38" stroke-width="9"/>
    <path d="M850 1300Q885 1270 905 1305" fill="none" stroke="#ffd19b" stroke-width="8" stroke-linecap="round"/>
   </g>
   <!-- face -->
   <path d="M330 610Q330 455 445 420Q590 365 715 465Q795 540 760 730Q735 900 580 940Q430 940 355 810Q315 730 330 610Z" fill="url(#skin)" stroke="#8d4a3b" stroke-width="14"/>

   <circle cx="315" cy="790" r="42" fill="none" stroke="url(#gold)" stroke-width="15"/><circle cx="782" cy="790" r="42" fill="none" stroke="url(#gold)" stroke-width="15"/>
   <!-- curly hair cap, layered curls with highlight strokes -->
   <path d="M320 650Q285 525 375 440Q450 350 570 380Q715 360 785 500Q815 570 775 670Q740 590 685 570Q610 530 560 575Q475 520 415 590Q375 630 320 650Z" fill="url(#hair)" stroke="#17131e" stroke-width="13"/>
   <g fill="#342738" stroke="#66505a" stroke-width="7">
    <circle cx="365" cy="535" r="48"/><circle cx="415" cy="470" r="55"/><circle cx="480" cy="425" r="58"/><circle cx="550" cy="412" r="58"/><circle cx="620" cy="430" r="58"/><circle cx="690" cy="475" r="58"/><circle cx="745" cy="540" r="52"/>
    <circle cx="345" cy="610" r="42"/><circle cx="405" cy="570" r="48"/><circle cx="475" cy="535" r="48"/><circle cx="550" cy="520" r="52"/><circle cx="625" cy="535" r="50"/><circle cx="700" cy="570" r="48"/><circle cx="765" cy="615" r="42"/>

   <text id="cap2" x="540" y="1770" font-size="76" fill="#ffd17d" stroke="#17111a" stroke-width="17" paint-order="stroke" opacity="0">ATÉ ELA CANTAR</text>

</svg>
<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const particles=$('particles');
let seed=441; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
for(let i=0;i<95;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',String(90+rnd()*900));c.setAttribute('cy',String(320+rnd()*1330));c.setAttribute('r',String(.8+rnd()*3.4));c.setAttribute('fill',i%4?'#ffdba4':'#fff4d0');c.setAttribute('opacity',String(.12+rnd()*.5));c.dataset.x=c.getAttribute('cx');c.dataset.y=c.getAttribute('cy');c.dataset.s=String(.25+rnd()*.8);particles.appendChild(c)}
window.DUR=10; window.READY=true;
window.render=(t)=>{
 const f=Math.max(0,Math.min(10,t)), beat=Math.sin(f*2.2), breath=Math.sin(f*2.4);
 $('camera').setAttribute('transform',`translate(${Math.sin(f*.42)*12} ${Math.cos(f*.36)*8}) scale(${1+Math.min(f/10,.025)}) translate(-12 -8)`);
 $('singer').setAttribute('transform',`translate(0 ${Math.sin(f*2.2)*8}) rotate(${Math.sin(f*1.1)*1.2} 540 1000)`);
 $('leftArm').setAttribute('transform',`rotate(${-7+Math.sin(f*1.8)*8} 340 1080)`);
 $('rightArm').setAttribute('transform',`rotate(${-8+Math.sin(f*2.3)*5} 720 1080)`);
 $('mic').setAttribute('transform',`rotate(${-18+Math.sin(f*2.1)*3} 720 860)`);
 const open=(Math.sin(f*10.5)>-.15 && f>1.1 && f<8.8);
 $('mouth').setAttribute('opacity',open?'1':'0');$('mouthClosed').setAttribute('opacity',open?'0':'1');
 const blink=(f%3.7<.13); document.querySelectorAll('#singer ellipse').forEach((e)=>{if(e.getAttribute('ry')==='35')e.setAttribute('ry',blink?'3':'35')});
 $('cap1').setAttribute('opacity',f<4.8?'1':'0');$('cap2').setAttribute('opacity',f>=4.8&&f<9.4?'1':'0');
 $('bulb').setAttribute('opacity',String(.88+.12*Math.sin(f*7)));
 $('beam').setAttribute('opacity',String(.065+.025*Math.sin(f*2)));
 [...particles.children].forEach((p,i)=>{const y=Number(p.dataset.y)-f*(10+Number(p.dataset.s)*16);p.setAttribute('cy',String(320+((y-320+1400)%1400)));p.setAttribute('cx',String(Number(p.dataset.x)+Math.sin(f*.8+i)*10));});
 $('camera').style.filter=f>4.8&&f<5.15?'url(#motion)':'none';
};
window.render(0);
</script></body></html>
